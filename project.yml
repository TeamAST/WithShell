name: WithShell
options:
  bundleIdPrefix: com.teamast
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    from: "1.99.0"
  Citadel:
    url: https://github.com/orlandos-nl/Citadel
    from: "0.12.0"
  swift-crypto:
    url: https://github.com/apple/swift-crypto.git
    from: "3.12.3"
  swift-nio-ssh:
    url: https://github.com/Wellz26/swift-nio-ssh.git
    from: "0.3.4"
  swift-nio:
    url: https://github.com/apple/swift-nio.git
    from: "2.81.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  WithShell:
    type: application
    platform: macOS
    sources:
      - path: WithShell
        excludes:
          - "**/README.md"
    dependencies:
      - package: SwiftTerm
      - package: Citadel
      - package: swift-crypto
        products: [Crypto, _CryptoExtras]
      - package: swift-nio-ssh
        product: NIOSSH
      - package: swift-nio
        product: NIOCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.teamast.withshell
        PRODUCT_NAME: WithShell
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: WithShell
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: WithShell/Resources/WithShell.entitlements
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_OBJC_BRIDGING_HEADER: WithShell/WithShell-Bridging-Header.h
        # FreeRDP는 scripts/build-freerdp.sh 로 ThirdParty/FreeRDP 에 빌드한다 (arm64 정적 라이브러리)
        ARCHS: arm64
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/WithShell/Vendor/BcryptPBKDF
          - $(SRCROOT)/WithShell/RDP
          - $(SRCROOT)/ThirdParty/FreeRDP/include/freerdp3
          - $(SRCROOT)/ThirdParty/FreeRDP/include/winpr3
          - $(SRCROOT)/ThirdParty/FreeRDP/include
          - $(SRCROOT)/WithShell/Vault
        LIBRARY_SEARCH_PATHS:
          - $(SRCROOT)/ThirdParty/FreeRDP/lib
          - $(SRCROOT)/ThirdParty/FreeRDP/lib/freerdp3
        OTHER_LDFLAGS:
          - -lfreerdp-client3
          - -lfreerdp3
          - -lwinpr3
          - -lrdpsnd-common
          - -lremdesk-common
          - -lssl
          - -lcrypto
          - -lz
          - -framework CoreFoundation
          - -framework Security
          - -framework AudioToolbox
          - -framework CoreAudio
          - -framework IOKit
          - -framework SystemConfiguration
          - -framework AVFoundation
          - -framework VideoToolbox
          - -framework CoreMedia
          - -framework CoreVideo
  WithShellTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: WithShellTests
        excludes:
          - Fixtures
      - path: WithShellTests/Fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: WithShell
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        ARCHS: arm64
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/WithShell.app/Contents/MacOS/WithShell
schemes:
  WithShell:
    build:
      targets:
        WithShell: all
    test:
      targets:
        - WithShellTests
